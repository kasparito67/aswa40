<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aimer Star Wars à 40 ans</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#080a0b}iframe{display:block}</style></head><body><iframe id="app" src="/index.html?v=20260901b"></iframe><script>const frame=document.getElementById('app');frame.addEventListener('load',()=>{const w=frame.contentWindow,d=frame.contentDocument;const s=d.createElement('script');s.src='/validated-posters.js?v=20260901b';s.onload=()=>{let busy=false;const enforce=()=>{if(busy)return;busy=true;requestAnimationFrame(()=>{const map=w.ASWA_POSTERS||{};d.querySelectorAll('[data-rank]').forEach(card=>{const r=Number(card.dataset.rank||card.dataset.r);if(r<26)return;const im=card.querySelector('img');if(!im)return;const wanted=map[String(r)];if(wanted){if(im.getAttribute('src')!==wanted)im.setAttribute('src',wanted)}else if(im.hasAttribute('src'))im.removeAttribute('src')});busy=false})};enforce();const mo=new MutationObserver(enforce);mo.observe(d.documentElement,{subtree:true,attributes:true,attributeFilter:['src'],childList:true});setTimeout(enforce,500);setTimeout(enforce,1500);setTimeout(enforce,4000)};d.head.appendChild(s)});</script></body></html>
