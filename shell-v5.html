<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="aswa40-shell-version" content="v5-direct-frame">
<title>Aimer Star Wars à 40 ans</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=5">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0b}
#stage{position:fixed;inset:0;border:0;width:100%;height:100%;opacity:0;transition:opacity .22s ease;background:#080a0b}
#stage.ready{opacity:1}
#boot{position:fixed;inset:0;display:grid;place-items:center;background:#080a0b;color:#7f878b;font:700 10px/1 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;transition:opacity .18s ease}
#boot.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="boot">Chargement…</div>
<iframe id="stage" src="/__original?v=5" title="Aimer Star Wars à 40 ans"></iframe>
<script>
(function(){
  const frame=document.getElementById('stage');
  const boot=document.getElementById('boot');
  const posterMap={
    'american psycho':'https://atthemovies.uk/cdn/shop/products/AmericanPsycho2000us27x40in275.jpg?v=1621383112',
    'boyhood':'https://d32qys9a6wm9no.cloudfront.net/images/movies/poster/e3/e35d7a5768c4b85b4780384d55dc3620_original.jpg?t=1636102095',
    'downfall':'https://www.prints4u.net/wp-content/uploads/2021/04/Downfall-002.jpg',
    'der untergang':'https://www.prints4u.net/wp-content/uploads/2021/04/Downfall-002.jpg',
    'dunkirk':'https://townsquare.media/site/442/files/2016/12/dunkirk-poster.jpg?q=75&w=1080',
    'ex machina':'https://cdn1.lockerdome.com/uploads/377769d0cb987385cc42f973c934b6fbf8dfc790b9524b99466ef92490b96b11_%3Aoriginal',
    'get out':'https://uauposters.com.br/media/catalog/product/cache/1/thumbnail/800x930/9df78eab33525d08d6e5fb8d27136e95/3/5/353720210407-uau-posters-corra-get-out-filmes-4.jpg',
    'harry potter':'https://cinema10.com.br/upload/featuredImage.php?url=https%3A%2F%2Fcinema10.com.br%2Fupload%2Ffilmes%2Ffilmes_483_MV5BMTU3NDUwNjQyNF5BMl5BanBnXkFtZTYwMTY0NTk2._V1_.jpg',
    'harry potter franchise':'https://cinema10.com.br/upload/featuredImage.php?url=https%3A%2F%2Fcinema10.com.br%2Fupload%2Ffilmes%2Ffilmes_483_MV5BMTU3NDUwNjQyNF5BMl5BanBnXkFtZTYwMTY0NTk2._V1_.jpg',
    'interstellar':'https://m.media-amazon.com/images/S/pv-target-images/5e54c6be807509eb2f33d78df6cced73638c6a9eb037b413a3313e063cdcac21.jpg',
    'mad max':'https://pics.filmaffinity.com/Mad_Max_Furia_en_el_camino-941035447-large.jpg',
    'mad max fury road':'https://pics.filmaffinity.com/Mad_Max_Furia_en_el_camino-941035447-large.jpg',
    'mad max: fury road':'https://pics.filmaffinity.com/Mad_Max_Furia_en_el_camino-941035447-large.jpg',
    'moonlight':'https://artofthemovies.co.uk/cdn/shop/products/moonlight_3db2fc82-609882.jpg?v=1627611506&width=1946',
    'parasite':'https://i0.wp.com/metagalaxia.com.br/wp-content/uploads/2020/04/parasita-filme-oscar-resenha-poster.jpg?resize=971%2C1500&ssl=1',
    'the revenant':'https://iv1.lisimg.com/image/9483833/740full-the-revenant-poster.jpg',
    'up':'https://www.posterhub.com.sg/images/detailed/5/up1.jpg'
  };
  const cross='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2v17.6M6.6 8.7h10.8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>';
  const hearts='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.7 18.3 4.4 15.2C2 13 3.2 9.3 6.1 9.3c1.1 0 2 .5 2.7 1.4.6-.9 1.5-1.4 2.6-1.4 2.9 0 4.1 3.7 1.7 5.9l-3.3 3.1c-.6.6-1.5.6-2.1 0Z" fill="none" stroke="currentColor" stroke-width="1.55"/><path d="M14.1 18.3 10.8 15.2c-2.4-2.2-1.2-5.9 1.7-5.9 1.1 0 2 .5 2.7 1.4.6-.9 1.5-1.4 2.6-1.4 2.9 0 4.1 3.7 1.7 5.9l-3.3 3.1c-.6.6-1.5.6-2.1 0Z" fill="none" stroke="currentColor" stroke-width="1.55"/></svg>';
  const norm=s=>(s||'').toLowerCase().replace(/^[#]?\d+\.?\s*/,'').replace(/\s+/g,' ').trim();

  async function patch(d){
    if(!d) return;
    const firstPass=d.documentElement.dataset.aswaV5!=='1';
    d.documentElement.dataset.aswaV5='1';

    if(firstPass){
    const style=d.createElement('style');
    style.id='aswa-v5-fixes';
    style.textContent=`
      .hero-title h1{font-weight:700!important;line-height:.86!important;letter-spacing:-.062em!important}
      .hero-title em{font-weight:700!important}
      .sec:not(.open){transition:border-color .22s ease,background-color .22s ease,box-shadow .22s ease,transform .22s ease}
      .sec:not(.open)>.toggle{transition:background-color .22s ease}
      .sec:not(.open)>.toggle strong{transition:color .22s ease}
      .content{transition:height .58s cubic-bezier(.16,1,.3,1),opacity .34s ease!important}
      .sec.open .inner{animation:aswaWindowIn .34s cubic-bezier(.16,1,.3,1) both}
      @keyframes aswaWindowIn{from{opacity:.25;transform:translateY(7px) scale(.994)}to{opacity:1;transform:none}}
      #topHero .tile.cf-active{transform:translate3d(0,-4px,0) scale(1.20)!important}
      #topRest .tile.cf-active{transform:translate3d(0,-8px,62px) scale(1.34)!important}
      #full .tile.cf-active{transform:translate3d(0,-9px,76px) scale(1.41)!important}
      #bottom .tile.cf-active{transform:translate3d(0,-8px,62px) scale(1.33)!important}
      .tile.cf-active img{object-fit:contain!important;background:#090b0c}
      @media (hover:hover) and (pointer:fine){
        .stack>.sec:not(.open):hover{border-color:#4b5960;background:#11171a;box-shadow:0 12px 34px rgba(0,0,0,.22);transform:translateY(-1px)}
        .stack>.sec:not(.open):hover>.toggle{background:linear-gradient(90deg,rgba(255,49,49,.07),transparent 52%)}
        .stack>.sec:not(.open):hover>.toggle strong{color:#fff}
        .stack>.sec:not(.open):hover>.toggle .arr{transform:translateY(3px)}
      }
      @media(prefers-reduced-motion:reduce){.sec.open .inner{animation:none!important}}
    `;
    d.head.appendChild(style);
    }

    let hero=d.querySelector('.hero-media');
    if(hero && hero.dataset.aswaHero!=='v5'){
      try{
        const b64=await fetch('/assets/header-lotr.webp.b64.txt?v=5',{cache:'force-cache'}).then(r=>r.text());
        hero.src='data:image/webp;base64,'+b64.trim();
        hero.dataset.aswaHero='v5';
      }catch(e){console.error('ASWA40 hero payload',e)}

      hero.removeAttribute('srcset');
      hero.style.objectPosition='center 58%';
      hero.style.filter='saturate(.8) contrast(1.08) brightness(.72)';
    }

    d.querySelectorAll('.insight-card').forEach(card=>{
      const txt=norm(card.textContent);
      const icon=card.querySelector('.insight-icon');
      if(!icon)return;
      if(txt.includes('religion commune')) icon.innerHTML=cross;
      if(txt.includes('duo')) icon.innerHTML=hearts;
    });

    d.querySelectorAll('.tile').forEach(tile=>{
      const label=tile.querySelector('.name');
      if(!label)return;
      const key=norm(label.textContent);
      const url=posterMap[key];
      if(!url)return;
      let img=tile.querySelector('img');
      if(!img){img=d.createElement('img');tile.insertBefore(img,tile.firstChild)}
      img.src=url;
      img.alt=label.textContent.trim();
      img.removeAttribute('srcset');
      img.removeAttribute('data-src');
      img.classList.remove('poster-deferred');
      img.classList.add('is-loaded');
    });

    let fav=d.querySelector('link[rel="icon"]');
    if(!fav){fav=d.createElement('link');fav.rel='icon';d.head.appendChild(fav)}
    fav.href='/favicon.svg?v=5';

    const waits=[];
    if(hero && hero.decode) waits.push(hero.decode().catch(()=>{}));
    if(d.fonts && d.fonts.ready) waits.push(d.fonts.ready.catch(()=>{}));
    return Promise.allSettled(waits);
  }

  frame.addEventListener('load', async ()=>{
    try{
      const d=frame.contentDocument;
      await patch(d);
      setTimeout(()=>patch(d),120);
      setTimeout(()=>patch(d),700);
    }catch(e){ console.error('ASWA40 v5 patch',e); }
    requestAnimationFrame(()=>{
      frame.classList.add('ready');
      boot.classList.add('hide');
      setTimeout(()=>boot.remove(),220);
    });
  });
})();
</script>
</body>
</html>
