  <script>
    (()=>{
      const params=new URLSearchParams(location.search);
      const forceDesktop=params.get('desktop')==='1';
      window.__ASWA40_FORCE_DESKTOP__=forceDesktop;
      if(!forceDesktop)return;
      const meta=document.querySelector('meta[name="viewport"]');
      const deviceWidth=Math.max(320,Math.min(screen.width||390,700));
      const scale=Math.max(.2,Math.min(1,deviceWidth/1440));
      meta?.setAttribute('content',`width=1440,initial-scale=${scale},minimum-scale=${scale},maximum-scale=3,user-scalable=yes`);
      document.documentElement.classList.add('force-desktop-preview');
    })();
  </script>
