<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <base href="/v2/">
  <title>ASWA40 · Platform rebuild</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://image.tmdb.org" crossorigin>
  <link rel="dns-prefetch" href="//image.tmdb.org">
  <link rel="preload" href="../assets/inter-tight-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../assets/inter-tight-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/hero.css">
  <link rel="stylesheet" href="styles/legacy-parity.css">
  <link rel="stylesheet" href="styles/content-expansion.css">
  <link rel="stylesheet" href="styles/modal-polish.css">
  <link rel="stylesheet" href="styles/section-polish.css">
  <link rel="stylesheet" href="styles/interaction-fix.css">
  <link rel="stylesheet" href="styles/parallax.css">
  <link rel="stylesheet" href="styles/qa-fixes.css">
</head>
<body>
  <div class="app" id="app">
    <main class="stage" id="stage"></main>
    <button class="era-arrow era-prev" id="eraPrev" type="button" aria-label="Top précédent">←</button>
    <button class="era-arrow era-next" id="eraNext" type="button" aria-label="Top suivant">→</button>
    <div class="era-hud" id="eraHud" aria-label="Navigation entre les tops"></div>
  </div>

  <div class="modal-bg" id="modalBg" aria-hidden="true">
    <article class="film-modal" id="filmModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" id="modalClose" type="button" aria-label="Fermer">×</button>
      <button class="modal-nav modal-prev" id="modalPrev" type="button" aria-label="Film précédent">‹</button>
      <button class="modal-nav modal-next" id="modalNext" type="button" aria-label="Film suivant">›</button>
      <div class="modal-backdrop"><img id="modalBackdrop" alt=""></div>
      <div class="modal-content">
        <img class="modal-poster" id="modalPoster" alt="">
        <div class="modal-copy">
          <div class="modal-rank" id="modalRank"></div>
          <h2 id="modalTitle"></h2>
          <div class="modal-stats" id="modalStats"></div>
          <div class="modal-body" id="modalBody"></div>
        </div>
      </div>
    </article>
  </div>

  <script src="../scripts/data.js"></script>
  <script src="../scripts/backdrops.js"></script>
  <script src="scripts/data.js"></script>
  <script src="scripts/new-tops.js"></script>
  <script src="scripts/animation-fix.js"></script>
  <script src="scripts/expanded-tops.js"></script>
  <script src="scripts/poster-metadata.js"></script>
  <script src="scripts/poster-aliases.js"></script>
  <script src="scripts/expansion-media.js"></script>
  <script src="scripts/qa-data-fixes.js"></script>
  <script src="scripts/top-skeletons.js"></script>
  <script src="scripts/hero-config.js"></script>
  <script src="scripts/section-polish.js"></script>
  <script src="scripts/qa-fixes.js"></script>
  <script src="scripts/app.js"></script>
  <script src="scripts/legacy-parity.js"></script>
  <script src="scripts/content-expansion.js"></script>
  <script src="scripts/ovnis-polish.js"></script>
  <script src="scripts/parallax.js"></script>
</body>
</html>
