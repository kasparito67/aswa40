<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aimer Star Wars à 40 ans</title>
  <style>
    html,body{margin:0;min-height:100%;background:#080a0b;color:#f5f3ef;font-family:system-ui,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;color:#9da1a4;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="boot">Chargement…</div>
  <script>
    (async function(){
      try{
        const response=await fetch('/__original',{cache:'no-cache'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        let html=await response.text();

        const religionOld='<span class="insight-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.7 20.2 6 18a3.5 3.5 0 0 1-1.3-2.7V9.4c0-.9.5-1.5 1.3-1.5.6 0 1 .4 1.2 1l1.1 4.2M15.3 20.2 18 18a3.5 3.5 0 0 0 1.3-2.7V9.4c0-.9-.5-1.5-1.3-1.5-.6 0-1 .4-1.2 1l-1.1 4.2M8.3 13.1l2.4-8.7c.2-.8.7-1.2 1.3-1.2s1.1.4 1.3 1.2l2.4 8.7M8.7 20.2 12 16l3.3 4.2" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
        const religionNew='<span class="insight-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2v17.6M6.6 8.7h10.8" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/></svg></span>';

        const duoOld='<span class="insight-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 17.8c-2.4-1.7-5.6-4.5-5.6-7.6a3.4 3.4 0 0 1 6.3-1.8M14.2 17.8c2.4-1.7 5.6-4.5 5.6-7.6a3.4 3.4 0 0 0-6.3-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 20s-6-3.8-6-8a3.3 3.3 0 0 1 6-1.9A3.3 3.3 0 0 1 18 12c0 4.2-6 8-6 8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>';
        const duoNew='<span class="insight-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.4 18.4 5.2 14.5C2.6 12.1 3.9 8 7.1 8c1.2 0 2.2.6 2.9 1.5.7-.9 1.7-1.5 2.9-1.5 3.2 0 4.5 4.1 1.9 6.5l-4.2 3.9c-.3.3-.9.3-1.2 0Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/><path d="M13.4 18.4 9.2 14.5C6.6 12.1 7.9 8 11.1 8c1.2 0 2.2.6 2.9 1.5.7-.9 1.7-1.5 2.9-1.5 3.2 0 4.5 4.1 1.9 6.5l-4.2 3.9c-.3.3-.9.3-1.2 0Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/></svg></span>';

        html=html.replace(religionOld,religionNew).replace(duoOld,duoNew);

        const patchStyle=`<style id="aswa40-small-corrections">
          .sec:not(.open){transition:border-color .22s ease,background-color .22s ease,box-shadow .22s ease}
          .sec:not(.open)>.toggle{transition:background-color .22s ease}
          .sec:not(.open)>.toggle strong{transition:color .22s ease}
          @media (hover:hover) and (pointer:fine){
            .stack>.sec:not(.open):hover{border-color:#4b5960;background:#11171a;box-shadow:0 0 0 1px rgba(255,255,255,.025) inset,0 12px 34px rgba(0,0,0,.22)}
            .stack>.sec:not(.open):hover>.toggle{background:linear-gradient(90deg,color-mix(in srgb,var(--section-accent,var(--a)) 7%,transparent),transparent 48%)}
            .stack>.sec:not(.open):hover>.toggle strong{color:#fff}
            .stack>.sec:not(.open):hover>.toggle .arr{color:var(--section-accent,var(--a));transform:translateY(3px)}
          }
        </style>`;
        const favicon='<link rel="icon" type="image/svg+xml" href="/favicon.svg">';
        html=html.replace('</head>',favicon+patchStyle+'</head>');

        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.querySelector('.boot').textContent='Impossible de charger le site';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
