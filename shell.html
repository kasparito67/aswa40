<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aimer Star Wars à 40 ans</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    html,body{margin:0;min-height:100%;background:#080a0b;color:#f5f3ef;font-family:system-ui,sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;color:#9da1a4;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
  </style>
</head>
<body>
  <div class="boot">Chargement…</div>
  <script>
    (async function(){
      try{
        const response=await fetch('/__original',{cache:'no-cache'});
        if(!response.ok) throw new Error('HTTP '+response.status);
        let html=await response.text();

        const religionOld='<span class="insight-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.7 20.2 6 18a3.5 3.5 0 0 1-1.3-2.7V9.4c0-.9.5-1.5 1.3-1.5.6 0 1 .4 1.2 1l1.1 4.2M15.3 20.2 18 18a3.5 3.5 0 0 0 1.3-1.5 1.3-1.5-.6-1.5-1.3-1.5-.6 0-1 .4-1.2 1l-1.1 4.2M8.3 13.1l2.4-8.7c.2-.8.7-1.2 1.3-1.2s1.1.4 1.3 1.2l2.4 8.7M8.7 20.2 12 16l3.3 4.2" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';
        const religionNew='<span class="insight-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2v17.6M6.6 8.7h10.8" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/></svg></span>';
        const duoOld='<span class="insight-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.8 17.8c-2.4-1.7-5.6-4.5-5.6-7.6a3.4 3.4 0 0 1 6.3-1.8M14.2 17.8c2.4-1.7 5.6-4.5 5.6-7.6a3.4 3.4 0 0 0-6.3-1.8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 20s-6-3.8-6-8a3.3 3.3 0 0 1 6-1.9A3.3 3.3 0 0 1 18 12c0 4.2-6 8-6 8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg></span>';
        const duoNew='<span class="insight-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.2 18.5 4.6 15.1C2.4 13 3.5 9.4 6.3 9.4c1.1 0 2 .5 2.6 1.4.6-.9 1.5-1.4 2.6-1.4 2.8 0 3.9 3.6 1.7 5.7l-3.6 3.4c-.4.4-1 .4-1.4 0Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/><path d="M14.4 18.5 10.8 15.1c-2.2-2.1-1.1-5.7 1.7-5.7 1.1 0 2 .5 2.6 1.4.6-.9 1.5-1.4 2.6-1.4 2.8 0 3.9 3.6 1.7 5.7l-3.6 3.4c-.4.4-1 .4-1.4 0Z" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/></svg></span>';
        html=html.replace(religionOld,religionNew).replace(duoOld,duoNew);

        function esc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
        function poster(titles,url){
          for(const title of titles){
            const re=new RegExp('(\\"title\\":\\"'+esc(title)+'\\"[\\s\\S]{0,420}?\\"img\\":\\")([^\\"]*)(\\")');
            if(re.test(html)){ html=html.replace(re,'$1'+url+'$3'); return; }
          }
        }

        poster(['American Psycho'],'https://atthemovies.uk/cdn/shop/products/AmericanPsycho2000us27x40in275.jpg?v=1621383112');
        poster(['Boyhood'],'https://d32qys9a6wm9no.cloudfront.net/images/movies/poster/e3/e35d7a5768c4b85b4780384d55dc3620_original.jpg?t=1636102095');
        poster(['Downfall','Der Untergang'],'https://www.prints4u.net/wp-content/uploads/2021/04/Downfall-002.jpg');
        poster(['Dunkirk'],'https://townsquare.media/site/442/files/2016/12/dunkirk-poster.jpg?q=75&w=1080');
        poster(['Ex Machina'],'https://cdn1.lockerdome.com/uploads/377769d0cb987385cc42f973c934b6fbf8dfc790b9524b99466ef92490b96b11_%3Aoriginal');
        poster(['Get Out'],'https://uauposters.com.br/media/catalog/product/cache/1/thumbnail/800x930/9df78eab33525d08d6e5fb8d27136e95/3/5/353720210407-uau-posters-corra-get-out-filmes-4.jpg');
        poster(['Harry Potter','Harry Potter franchise','Harry Potter Franchise'],'https://cinema10.com.br/upload/featuredImage.php?url=https%3A%2F%2Fcinema10.com.br%2Fupload%2Ffilmes%2Ffilmes_483_MV5BMTU3NDUwNjQyNF5BMl5BanBnXkFtZTYwMTY0NTk2._V1_.jpg');
        poster(['Interstellar'],'https://m.media-amazon.com/images/S/pv-target-images/5e54c6be807509eb2f33d78df6cced73638c6a9eb037b413a3313e063cdcac21.jpg');
        poster(['Mad Max: Fury Road','Mad Max Fury Road','Mad Max'],'https://pics.filmaffinity.com/Mad_Max_Furia_en_el_camino-941035447-large.jpg');
        poster(['Moonlight'],'https://artofthemovies.co.uk/cdn/shop/products/moonlight_3db2fc82-609882.jpg?v=1627611506&width=1946');
        poster(['Parasite'],'https://i0.wp.com/metagalaxia.com.br/wp-content/uploads/2020/04/parasita-filme-oscar-resenha-poster.jpg?resize=971%2C1500&ssl=1');
        poster(['The Revenant'],'https://iv1.lisimg.com/image/9483833/740full-the-revenant-poster.jpg');
        poster(['Up','UP'],'https://www.posterhub.com.sg/images/detailed/5/up1.jpg');

        const patchStyle=`<style id="aswa40-small-corrections">
          .sec:not(.open){transition:border-color .22s ease,background-color .22s ease,box-shadow .22s ease,transform .22s ease}
          .sec:not(.open)>.toggle{transition:background-color .22s ease}
          .sec:not(.open)>.toggle strong{transition:color .22s ease}
          @media (hover:hover) and (pointer:fine){
            .stack>.sec:not(.open):hover{border-color:#4b5960;background:#11171a;box-shadow:0 0 0 1px rgba(255,255,255,.025) inset,0 12px 34px rgba(0,0,0,.22);transform:translateY(-1px)}
            .stack>.sec:not(.open):hover>.toggle{background:linear-gradient(90deg,color-mix(in srgb,var(--section-accent,var(--a)) 8%,transparent),transparent 50%)}
            .stack>.sec:not(.open):hover>.toggle strong{color:#fff}
            .stack>.sec:not(.open):hover>.toggle .arr{color:var(--section-accent,var(--a));transform:translateY(3px)}
          }
        </style>`;
        html=html.replace('</head>','<link rel="icon" type="image/svg+xml" href="/favicon.svg">'+patchStyle+'</head>');

        document.open();
        document.write(html);
        document.close();
      }catch(err){
        document.querySelector('.boot').textContent='Impossible de charger le site';
        console.error(err);
      }
    })();
  </script>
</body>
</html>
