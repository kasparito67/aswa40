name: Apply ASWA40 direct fixes

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_direct_fixes.py'
      - '.github/workflows/apply-direct-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch real index.html
        run: python scripts/apply_direct_fixes.py
      - name: Commit source changes
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes needed.'
            exit 0
          fi
          git config user.name 'aswa40-source-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply UI fixes directly to ASWA40 index'
          git push
