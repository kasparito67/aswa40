name: Apply director quartet

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-director-quartet.py'
      - '.github/workflows/apply-director-quartet.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Download local director portraits
        run: |
          mkdir -p assets/directors
          curl -L --fail --retry 2 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Denis%20Villeneuve%202017%20crop.jpg?width=500' -o assets/directors/denis-villeneuve.jpg
          curl -L --fail --retry 2 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Christopher%20nolan.jpg?width=500' -o assets/directors/christopher-nolan.jpg
          curl -L --fail --retry 2 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Quentin%20Tarantino%20Portrait.jpg?width=500' -o assets/directors/quentin-tarantino.jpg
          curl -L --fail --retry 2 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Wes%20Anderson.JPG?width=500' -o assets/directors/wes-anderson.jpg
      - run: python scripts/add-director-quartet.py
      - name: Commit quartet card and portraits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/directors
          git diff --cached --quiet && exit 0
          git commit -m 'Add director quartet insight card'
          git push
