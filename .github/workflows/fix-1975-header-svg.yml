name: Fix 1975-1999 header SVG

on:
  push:
    branches: [main]
    paths:
      - 'assets/header-title-1975-1999.svg'
      - '.github/workflows/fix-1975-header-svg.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch embedded header SVG from canonical asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, re

          page = Path('1975-1999/index.html')
          svg = Path('assets/header-title-1975-1999.svg')
          html = page.read_text(encoding='utf-8')
          encoded = base64.b64encode(svg.read_bytes()).decode('ascii')
          replacement = "background-image:url('data:image/svg+xml;base64," + encoded + "');"
          pattern = r"background-image:url\('data:image/svg\+xml;base64,[^']+'\);"
          updated, count = re.subn(pattern, replacement, html, count=1)
          if count != 1:
              raise SystemExit(f'Expected one header SVG data URI, found {count}')
          page.write_text(updated, encoding='utf-8')
          PY
      - name: Commit corrected SVG
        run: |
          if git diff --quiet -- 1975-1999/index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1975-1999/index.html
          git commit -m 'Fix 1975-1999 header SVG viewBox [skip ci]'
          git push origin main
