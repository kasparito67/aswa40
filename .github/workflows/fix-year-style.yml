name: Fix ASWA40 year style
on:
  push:
    paths:
      - 'scripts/fix-year-style.py'
      - '.github/workflows/fix-year-style.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-year-style.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Make 2000-2024 roman'
          git push
