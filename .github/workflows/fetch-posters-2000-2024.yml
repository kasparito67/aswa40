name: Fetch TMDB posters 2000-2024

on:
  push:
    branches: [work/tmdb-2000-2024]
    paths:
      - 'scripts/fetch-posters-2000-2024.mjs'
      - '.github/workflows/fetch-posters-2000-2024.yml'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/tmdb-2000-2024
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and map TMDB posters
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: node scripts/fetch-posters-2000-2024.mjs
      - name: Commit poster candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/posters/2000-2024 assets/grands-oublies/2000-2024 data/2000-2024/poster-manifest.json scripts/data.js
          git commit -m 'Fetch TMDB posters for Top 2000-2024'
          git push origin HEAD:work/tmdb-2000-2024
