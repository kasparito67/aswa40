name: Clean 1975 v0.9.36

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/clean-1975-v036.yml'

permissions:
  contents: write

jobs:
  rebuild-header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Convert 1975 page to true v0.9.36
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page = Path('1975-1999/index.html')
          html = page.read_text(encoding='utf-8')
          original = html

          # True version bump: remove stale 0.9.35 labeling everywhere.
          html = html.replace('v0.9.35', 'v0.9.36')
          html = html.replace('Version 0.9.35', 'Version 0.9.36')

          # Replace the embedded SVG data URI with the canonical SVG asset.
          html, n_svg = re.subn(
              r"background:url\('data:image/svg\+xml;base64,[^']+'\)",
              "background:url('../assets/header-title-1975-1999.svg') center/contain no-repeat",
              html,
              count=1,
          )

          # Remove the old cropped 1320x580 frame and use the SVG's native 16:9 canvas.
          html, n_ratio = re.subn(
              r'aspect-ratio:1320/580!important',
              'aspect-ratio:16/9!important',
              html,
              count=1,
          )

          # Update the legacy comment so future debugging reflects the actual build.
          html = html.replace(
              '/* v0.9.36 exact 1975–1999 hero artwork */',
              '/* v0.9.36 canonical 1975–1999 hero artwork — native SVG asset */'
          )

          # Make sure the canonical asset is referenced exactly once in the hero CSS.
          if n_svg != 1:
              raise SystemExit(f'Expected 1 embedded hero SVG to replace, found {n_svg}')
          if n_ratio != 1:
              raise SystemExit(f'Expected 1 legacy 1320/580 aspect ratio, found {n_ratio}')
          if "../assets/header-title-1975-1999.svg" not in html:
              raise SystemExit('Canonical SVG asset reference missing after migration')
          if 'data:image/svg+xml;base64' in html:
              # Other SVG data URIs are allowed, but the hero block should no longer use one.
              hero = re.search(r'/\* v0\.9\.36 canonical.*?(?=/\*|</style>)', html, flags=re.S)
              if hero and 'data:image/svg+xml;base64' in hero.group(0):
                  raise SystemExit('Hero still contains embedded SVG data URI')

          if html == original:
              raise SystemExit('No changes made')

          page.write_text(html, encoding='utf-8')
          PY
      - name: Commit true v0.9.36
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 1975-1999/index.html
          git commit -m 'Ship true 1975 v0.9.36 native SVG header [skip ci]'
          git push origin main
