name: Update year insight v2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-year-insight-v2.py'
      - '.github/workflows/update-year-insight-v2.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/update-year-insight-v2.py
      - name: Commit generated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Refine year insight card with chart"
          git push
