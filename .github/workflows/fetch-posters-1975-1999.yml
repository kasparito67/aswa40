name: Fetch 1975-1999 posters

on:
  push:
    branches:
      - local/top-1975-1999-assets
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-posters:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4
        with:
          ref: local/top-1975-1999-assets

      - name: Fetch TMDB poster candidates
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: node scripts/fetch-posters-1975-1999.mjs

      - name: Commit fetched assets and manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/posters/1975-1999 assets/grands-oublies/1975-1999 data/1975-1999 || true
          if git diff --cached --quiet; then
            echo "No poster changes to commit."
          else
            git commit -m "Fetch 1975-1999 TMDB poster candidates"
            git push origin HEAD:local/top-1975-1999-assets
          fi
