name: Fix Top 5 hover

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-top5-hover.py'
      - '.github/workflows/fix-top5-hover.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix-top5-hover.py
      - name: Commit Top 5 hover fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/styles.css
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Top 5 hover poster scaling'
          git push
