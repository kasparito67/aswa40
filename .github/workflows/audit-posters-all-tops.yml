name: Audit ASWA40 posters

on:
  push:
    branches: [work-cleanup-sept9]
    paths:
      - 'scripts/audit-posters-all-tops.mjs'
      - 'v2/scripts/**'
      - 'v2/styles/**'
      - 'data/**/poster-manifest*.json'
      - 'assets/posters/**'
      - 'v2/index.html'
      - 'ASWA40_POSTER_AUDIT.md'
      - 'ASWA40_PHASE3_MODAL_REPORT.md'
      - '.github/workflows/audit-posters-all-tops.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit posters and TMDB candidates
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: node scripts/audit-posters-all-tops.mjs
      - name: Show audit summary
        if: always()
        run: |
          cat poster-audit.md || true
      - name: Verify active wheel ownership
        run: |
          node <<'NODE' > wheel-handler-audit.txt
          const fs=require('fs');
          const html=fs.readFileSync('v2/index.html','utf8');
          const srcs=[...html.matchAll(/<script\s+src="([^"]+)"/g)].map(m=>m[1]).filter(s=>!/^https?:/.test(s));
          const rows=[];
          for(const src of srcs){
            const file=src.startsWith('../')?src.slice(3):`v2/${src}`;
            if(!fs.existsSync(file))continue;
            const text=fs.readFileSync(file,'utf8');
            const count=(text.match(/addEventListener\s*\(\s*['"]wheel['"]/g)||[]).length;
            if(count)rows.push({file,count});
          }
          const app=fs.readFileSync('v2/scripts/app.js','utf8');
          const modal=(app.match(/modal\.addEventListener\s*\(\s*['"]wheel['"]/g)||[]).length;
          const tops=(app.match(/app\.addEventListener\s*\(\s*['"]wheel['"]/g)||[]).length;
          console.log(JSON.stringify({activeWheelRegistrations:rows,modalNavigationHandlers:modal,topNavigationHandlers:tops},null,2));
          if(modal!==1||tops!==1)process.exit(1);
          NODE
          cat wheel-handler-audit.txt
      - name: Browser QC desktop and mobile
        run: |
          npm install --no-save --ignore-scripts playwright-core@1.55.0 >/dev/null 2>&1
          python3 -m http.server 4173 >/tmp/aswa40-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          mkdir -p qc-artifacts
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright-core');
          (async()=>{
            const candidates=['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'];
            const executablePath=candidates.find(fs.existsSync);
            if(!executablePath)throw new Error('No Chromium/Chrome executable found on runner');
            const browser=await chromium.launch({headless:true,executablePath,args:['--no-sandbox']});
            const results={url:'http://127.0.0.1:4173/v2/',desktop:{},mobile:{}};

            async function runCase(name,viewport,isMobile=false){
              const context=await browser.newContext({viewport,isMobile,hasTouch:isMobile,reducedMotion:'no-preference'});
              const page=await context.newPage();
              const consoleErrors=[],consoleWarnings=[],pageErrors=[],requestFailures=[],httpErrors=[];
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text());if(m.type()==='warning')consoleWarnings.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e)));
              page.on('requestfailed',r=>requestFailures.push({url:r.url(),error:r.failure()?.errorText||'failed'}));
              page.on('response',r=>{if(r.status()>=400)httpErrors.push({url:r.url(),status:r.status()})});
              await page.goto(results.url,{waitUntil:'networkidle',timeout:90000});
              await page.waitForSelector('.era-screen',{timeout:30000});
              const topCount=await page.locator('.era-screen').count();
              const labels=await page.locator('.era-screen').evaluateAll(es=>es.map(e=>e.dataset.topId));

              const firstTile=page.locator('.era-screen').first().locator('.tile').first();
              await firstTile.scrollIntoViewIfNeeded();
              await firstTile.click();
              await page.waitForSelector('.modal-bg.open',{timeout:10000});
              const initialTitle=(await page.locator('#modalTitle').textContent())?.trim();

              await page.keyboard.press('ArrowRight');
              await page.waitForTimeout(900);
              const keyboardTitle=(await page.locator('#modalTitle').textContent())?.trim();
              const keyboardNav=!!initialTitle&&!!keyboardTitle&&initialTitle!==keyboardTitle;

              const beforeWheel=(await page.locator('#modalTitle').textContent())?.trim();
              await page.locator('#filmModal').dispatchEvent('wheel',{deltaY:140,deltaX:0,bubbles:true,cancelable:true});
              await page.waitForTimeout(900);
              const afterWheel=(await page.locator('#modalTitle').textContent())?.trim();
              const modalWheelNav=!!beforeWheel&&!!afterWheel&&beforeWheel!==afterWheel;

              await page.keyboard.press('Escape');
              await page.waitForTimeout(250);
              const escapeClosed=!(await page.locator('.modal-bg').evaluate(el=>el.classList.contains('open')));

              const beforeTransform=await page.locator('#stage').evaluate(el=>getComputedStyle(el).transform);
              await page.locator('.era-screen').first().dispatchEvent('wheel',{deltaX:420,deltaY:0,bubbles:true,cancelable:true});
              await page.waitForTimeout(900);
              const afterTransform=await page.locator('#stage').evaluate(el=>getComputedStyle(el).transform);
              const topWheelNav=beforeTransform!==afterTransform;

              if(isMobile){
                // Return to first Top and verify a vertical gesture scrolls the screen instead of changing Top.
                await page.locator('#eraPrev').click().catch(()=>{});
                await page.waitForTimeout(700);
                const screen=page.locator('.era-screen').first();
                const beforeScroll=await screen.evaluate(el=>el.scrollTop);
                await screen.evaluate(el=>{el.scrollTop=Math.min(el.scrollHeight-el.clientHeight,420);el.dispatchEvent(new Event('scroll',{bubbles:true}))});
                await page.waitForTimeout(150);
                const afterScroll=await screen.evaluate(el=>el.scrollTop);
                results[name].verticalMobileScroll=afterScroll>beforeScroll;
              }

              await page.screenshot({path:`qc-artifacts/${name}.png`,fullPage:false});
              Object.assign(results[name],{
                viewport,topCount,labels,modalOpened:!!initialTitle,keyboardNav,modalWheelNav,escapeClosed,topWheelNav,
                consoleErrors,consoleWarnings,pageErrors,requestFailures,httpErrors
              });
              await context.close();
            }

            await runCase('desktop',{width:1440,height:1000},false);
            await runCase('mobile',{width:390,height:844},true);

            const reduced=await browser.newContext({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            const rp=await reduced.newPage();
            await rp.goto(results.url,{waitUntil:'domcontentloaded',timeout:90000});
            results.reducedMotion=await rp.evaluate(()=>matchMedia('(prefers-reduced-motion: reduce)').matches);
            await reduced.close();

            await browser.close();
            fs.writeFileSync('qc-artifacts/browser-qc.json',JSON.stringify(results,null,2));
            console.log(JSON.stringify(results,null,2));
            const failures=[];
            for(const name of ['desktop','mobile']){
              const r=results[name];
              if(r.topCount!==7)failures.push(`${name}: expected 7 Tops, got ${r.topCount}`);
              for(const k of ['modalOpened','keyboardNav','modalWheelNav','escapeClosed','topWheelNav'])if(!r[k])failures.push(`${name}: ${k} failed`);
              if(r.consoleErrors.length||r.pageErrors.length||r.requestFailures.length||r.httpErrors.length)failures.push(`${name}: console/network errors present`);
            }
            if(!results.mobile.verticalMobileScroll)failures.push('mobile: vertical scroll failed');
            if(!results.reducedMotion)failures.push('reduced motion media query not active in test context');
            if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload audit and QC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-consolidation-qc
          path: |
            poster-audit.json
            poster-audit.md
            wheel-handler-audit.txt
            qc-artifacts/desktop.png
            qc-artifacts/mobile.png
            qc-artifacts/browser-qc.json
