name: Ingest grands oublies archive

on:
  push:
    branches: [main]
    paths:
      - 'les-grands-oublies.zip'
      - '.github/workflows/ingest-grands-oublies.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract grands oublies images
        run: |
          test -f les-grands-oublies.zip || exit 0
          rm -rf .ghost-extract
          mkdir -p .ghost-extract assets/grands-oublies
          unzip -q -o les-grands-oublies.zip -d .ghost-extract
          find .ghost-extract -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) -print0 | while IFS= read -r -d '' file; do
            cp "$file" "assets/grands-oublies/$(basename "$file")"
          done
          ls -la assets/grands-oublies
      - name: Commit grands oublies images
        run: |
          test -f les-grands-oublies.zip || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/grands-oublies
          git rm les-grands-oublies.zip
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add grands oublies posters'
          git push
