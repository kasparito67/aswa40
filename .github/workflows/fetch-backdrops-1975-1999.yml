name: Fetch TMDB backdrops 1975-1999

on:
  push:
    branches:
      - local/top-1975-1999-assets
    paths:
      - scripts/fetch-backdrops-1975-1999.mjs
      - .github/workflows/fetch-backdrops-1975-1999.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch backdrops
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
        run: node scripts/fetch-backdrops-1975-1999.mjs
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/backdrops/1975-1999 assets/backdrops/grands-oublies-1975-1999 scripts/backdrops-1975-1999.js
          git diff --cached --quiet || git commit -m "Fetch 1975-1999 TMDB backdrops [skip ci]"
          git push
