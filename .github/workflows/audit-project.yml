name: Audit ASWA40 project

on:
  push:
    branches:
      - audit-debug-sept11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run project audit
        run: node scripts/audit-project.mjs
